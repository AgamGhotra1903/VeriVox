<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161B22"/>
      <stop offset="100%" stop-color="#0E1117"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- Background Shield -->
  <path d="M100 20 L165 50 L165 110 C165 150 100 180 100 180 C100 180 35 150 35 110 L35 50 Z" 
        fill="url(#bgGrad)" stroke="#30363D" stroke-width="4"/>

  <!-- Inner Glowing Shield Outline -->
  <path d="M100 28 L157 55 L157 108 C157 142 100 170 100 170 C100 170 43 142 43 108 L43 55 Z" 
        fill="none" stroke="url(#tealGrad)" stroke-width="2" opacity="0.6"/>

  <!-- Soundwave Bars inside Shield -->
  <g fill="url(#tealGrad)" rx="2">
    <rect x="65" y="88" width="6" height="24" rx="3" />
    <rect x="76" y="78" width="6" height="44" rx="3" />
    <rect x="87" y="65" width="6" height="70" rx="3" />
    <rect x="97" y="55" width="6" height="90" rx="3" fill="#38BDF8"/>
    <rect x="107" y="65" width="6" height="70" rx="3" />
    <rect x="118" y="78" width="6" height="44" rx="3" />
    <rect x="129" y="88" width="6" height="24" rx="3" />
  </g>

  <!-- Crosshair Forensic Focal Rings -->
  <circle cx="100" cy="100" r="42" fill="none" stroke="#2DD4BF" stroke-width="1.5" stroke-dasharray="4, 6" opacity="0.7"/>
</svg>
