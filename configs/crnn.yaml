# CRNN Architecture & Training Configuration (Agam Ghotra)
seed: 42
seeds: [42, 1337, 2024]
device: "cuda"

model:
  name: "crnn_forensics"
  in_channels: 1
  features: "lfcc"  # 'lfcc', 'logmel', 'combined'
  combined_fusion: "two_branch"  # 'two_branch' or 'channel_stack'

  # Architectural ablation toggles
  use_gru: true
  use_attention: true
  pooling: "attention"  # 'attention' or 'mean'

  # CNN Encoder
  cnn:
    channels: [32, 64, 128, 128]
    kernel_size: 3
    stride: 1
    padding: 1
    # MaxPool kernels and strides: prioritize frequency reduction while preserving temporal resolution
    pool_kernels: [[2, 2], [2, 2], [2, 1], [2, 1]]
    pool_strides: [[2, 2], [2, 2], [2, 1], [2, 1]]
    dropout: 0.1

  # Projection before RNN
  proj_dim: 128

  # Recurrent Network
  gru:
    hidden_size: 128  # bidirectional yields 256 output dimensions
    num_layers: 2
    dropout: 0.3
    bidirectional: true

  # Attention Mechanism
  attention:
    num_heads: 4
    dim: 256
    dropout: 0.1

  # Classifier Head
  classifier:
    hidden_dim: 128
    num_classes: 2
    dropout: 0.3

training:
  batch_size: 32
  num_workers: 4
  epochs: 40
  learning_rate: 0.001
  weight_decay: 0.0001
  optimizer: "adamw"  # 'adamw' or 'adam'
  lr_scheduler: "cosine"  # 'cosine' or 'plateau'
  min_lr: 0.000001
  warmup_epochs: 3

  # Mixed precision and stabilization
  amp: true
  grad_clip_norm: 5.0

  # Early stopping & model selection on dev EER
  early_stopping:
    enabled: true
    patience: 8
    monitor: "dev_eer"
    mode: "min"

  # Loss formulation
  loss:
    type: "weighted_cross_entropy"  # 'weighted_cross_entropy', 'cross_entropy', 'focal'
    class_weights: "auto"           # computes inverse frequency on train split
    focal_gamma: 2.0

  # SpecAugment
  augmentation:
    spec_augment: true
    freq_mask_max: 8
    time_mask_max: 20
    freq_masks_num: 2
    time_masks_num: 2
    codec_aug_prob: 0.0  # off by default, active only in codec ablation
