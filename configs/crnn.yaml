seed: 42
seeds: [42, 1337, 2024]
device: "auto"

features:
  feature_type: "lfcc"
  dim: 60
  normalization: "global_meanstd"
  stats_file: "checkpoints/normalization_stats.json"
  lfcc:
    sample_rate: 16000
    n_fft: 512
    win_length: 400
    hop_length: 160
    n_filter: 20
    n_lfcc: 20
    with_deltas: true
  logmel:
    sample_rate: 16000
    n_fft: 512
    win_length: 400
    hop_length: 160
    n_mels: 80
    f_min: 0.0
    f_max: 8000.0
    power: 2.0
    top_db: 80.0

model:
  name: "crnn_forensics"
  in_channels: 1
  in_freq_dim: 60
  features: "lfcc"
  combined_fusion: "two_branch"

  use_gru: true
  use_attention: true
  pooling: "attention"

  cnn:
    channels: [32, 64, 128, 128]
    kernel_size: 3
    stride: 1
    padding: 1
    pool_kernels: [[2, 2], [2, 2], [2, 1], [2, 1]]
    pool_strides: [[2, 2], [2, 2], [2, 1], [2, 1]]
    dropout: 0.1

  proj_dim: 128

  gru:
    hidden_size: 128
    num_layers: 2
    dropout: 0.3
    bidirectional: true

  attention:
    num_heads: 4
    dim: 256
    dropout: 0.1

  classifier:
    hidden_dim: 128
    num_classes: 2
    dropout: 0.3

  init_weights: true

training:
  batch_size: 32
  num_workers: 0
  epochs: 40
  learning_rate: 0.001
  weight_decay: 0.0001
  optimizer: "adamw"
  lr_scheduler: "plateau"
  min_lr: 0.000001
  warmup_epochs: 3

  amp: true
  grad_clip_norm: 5.0

  early_stopping:
    enabled: true
    patience: 5
    monitor: "dev_eer"
    mode: "min"

  loss:
    type: "weighted_cross_entropy"
    class_weights: "auto"
    focal_gamma: 2.0

  # SpecAugment
  augmentation:
    spec_augment: true
    freq_mask_max: 8
    time_mask_max: 20
    freq_masks_num: 2
    time_masks_num: 2
    codec_aug_prob: 0.0
