# Classical Baselines Configuration (Jashan Goyal)
seed: 42

features:
  feature_types: ["lfcc", "logmel", "combined"]
  normalization: "global_meanstd"
  statistics: ["mean", "std", "min", "max", "skewness", "kurtosis"]

models:
  logistic_regression:
    penalty: "l2"
    solver: "lbfgs"
    max_iter: 1000
    class_weight: "balanced"
    param_grid:
      C: [0.001, 0.01, 0.1, 1.0, 10.0, 100.0]

  rbf_svm:
    kernel: "rbf"
    probability: true
    class_weight: "balanced"
    max_samples: 10000  # stratified subsample for SVM quadratic scaling protection
    linear_fallback: true
    param_grid:
      C: [0.1, 1.0, 10.0]
      gamma: ["scale", "auto", 0.01, 0.1]

  random_forest:
    n_estimators: 200
    class_weight: "balanced_subsample"
    random_state: 42
    n_jobs: -1
    param_grid:
      n_estimators: [100, 200, 300]
      max_depth: [10, 20, 30, null]
      min_samples_split: [2, 5]

tuning:
  scoring: "roc_auc"
  cv_strategy: "predefined_split"  # tune strictly on dev split, never on eval
