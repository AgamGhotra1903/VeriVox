# CRNN Architecture & Training Configuration - LFCC Variant
seed: 42
seeds: [42, 1337, 2024]
device: "auto"

features:
  feature_type: "lfcc"
  dim: 60
  normalization: "global_meanstd"
  stats_file: "checkpoints/normalization_stats_lfcc.json"
  lfcc:
    sample_rate: 16000
    n_fft: 512
    win_length: 400
    hop_length: 160
    n_filter: 20
    n_lfcc: 20
    with_deltas: true

model:
  name: "crnn_forensics"
  in_channels: 1
  in_freq_dim: 60
  features: "lfcc"
  use_gru: true
  use_attention: true
  pooling: "attention"  # 'attention' or 'mean'
  proj_dim: 128
  gru_hidden: 128
  num_gru_layers: 2
  gru_dropout: 0.3
  conv_dropout: 0.1
  classifier_dropout: 0.3
  num_attn_heads: 4
  num_classes: 2
  init_weights: true

training:
  batch_size: 32
  num_workers: 0
  epochs: 40
  learning_rate: 0.001
  weight_decay: 0.0001
  optimizer: "adamw"  # 'adamw' or 'adam'
  lr_scheduler: "plateau"  # 'plateau' (ReduceLROnPlateau) or 'cosine'
  min_lr: 0.000001
  amp: true
  grad_clip_norm: 5.0

  early_stopping:
    enabled: true
    patience: 5
    monitor: "dev_eer"
    mode: "min"

  loss:
    type: "weighted_cross_entropy"
    class_weights: "auto"

  augmentation:
    spec_augment: true
    freq_mask_max: 8
    time_mask_max: 20
    freq_masks_num: 2
    time_masks_num: 2

