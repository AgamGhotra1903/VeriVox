name: CI

on:
  push:
    branches: [ main, master, fixes/final ]
  pull_request:
    branches: [ main, master, fixes/final ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install system audio dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run unit test suite
        id: test_run
        run: |
          pytest -v -ra --tb=short tests/ 2>&1 | tee test_run.log
        continue-on-error: true

      - name: Publish Test Results to Job Summary
        if: always()
        run: |
          echo "## Pytest Execution Summary" >> $GITHUB_STEP_SUMMARY
          if [ -f test_run.log ]; then
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 120 test_run.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "No test log produced." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Assert Test Suite Success
        run: |
          if [ ! -f test_run.log ]; then
            echo "Error: test_run.log not found."
            exit 1
          fi
          if grep -q "FAILED" test_run.log || grep -q "ERROR" test_run.log; then
            echo "Tests failed. Review step summary above."
            exit 1
          fi
          if ! grep -q "passed" test_run.log; then
            echo "No passing test marker found."
            exit 1
          fi
          echo "All tests verified successfully!"

      - name: Run provenance audit
        run: |
          python -m pytest tests/test_provenance.py -v


