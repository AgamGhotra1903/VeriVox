services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: acoustic-forensics-api
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - OMP_NUM_THREADS=4
    volumes:
      - ./data:/app/data
      - ./results:/app/results
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: acoustic-forensics-web
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

